[Command]
Name=プレーンテキストとしてクリップボードに書き込み
Command="
    copyq:
    // 選択されたアイテムが存在する場合にのみ実行
    if (selectedItems().length > 0) {
        for (var i = 0; i < selectedItems().length; i++) {
            var item = selectedItems()[i];
            var itemText = item.text;

            // 【厳格なチェック】アイテムが文字列かつ非nullであることの確認
            if (typeof itemText === 'string' && itemText !== null) {
                // テキストをサニタイズし、制御文字やBOMなどを除去
                var cleaned = cleanText(itemText);
                // 制約: テキストのコピーのみを実行。コピー前に空でないことを確認
                if (cleaned.length > 0) {
                    copy(cleaned);
                }
            }
        }
    }

    function cleanText(text) {
        // BOMや制御文字などを除去し、テキストをクリーンアップします
        return text.replace(/[\\uFEFF\\u0000-\\u001F\\u007F-\\u009F]/g, '');
    }
    "
InMenu=true
HideWindow=true
Icon=