[Command]
Name=プレーンテキストとしてクリップボードに書き込み
Command="
    copyq:
    var rows = selectedItems();
    if (!rows.length)
        abort();
    
    // --- 改善: cleanText関数を正規表現ベースに置き換え (最終確定版) ---
    function cleanText(s) {
        // 1. 文字列を確定的な文字列型に変換
        s = str(s);

        // 2. 削除・置換対象のパターンを定義:
        //    - 削除: FEFF, ゼロ幅系文字, WORD JOINER (0x2060), 制御文字, DEL
        //    - 置換: NBSP系・幅付きスペースは半角スペースに置換
        
        // 正規表現パターンを文字列リテラル内で動作する形式に修正 (\\uXXXX を使用)
        // 削除処理の実行
        var removedRegex = /[\\u0000-\\u0008\\u000b\\u000c\\u000e-\\u001f\\u007f\\ufeff\\u00ad\\u200b\\u200c\\u200d\\u2060]/g;
        s = s.replace(removedRegex, '');
        
        // 置換処理の実行 (スペース系文字を半角スペースに置換)
        var replaceRegex = /[\\u00a0\\u1680\\u2000-\\u200a\\u202f\\u205f]/g;
        s = s.replace(replaceRegex, ' ');
        
        return s;
    }
    
    var parts = [];
    for (var i = 0; i < rows.length; ++i) {
        parts.push(cleanText(read(rows[i])));
    }
    
    var nl = String.fromCharCode(10);
    var text = parts.join(nl);
    
    copy(text);
"
InMenu=true
HideWindow=true
Icon=